speedDropdown.value = String(
  Math.min(Number(savedPlaybackSpeed) || 1, maxSupportedPlaybackSpeed)
);

function getSelectedPlaybackSpeed() {
  const requestedSpeed = Number(speedDropdown.value) || 1;
  return Math.min(requestedSpeed, maxSupportedPlaybackSpeed);
}

function applyPlaybackSpeed(video) {
  const speed = getSelectedPlaybackSpeed();
  video.defaultPlaybackRate = speed;
  video.playbackRate = speed;
}

function renderVideos(selectedKey = "real_world_biza|Push the can near the blue cube.") {
  container.innerHTML = "";

  const item = videoMap[selectedKey];

  if (!item) {
    container.textContent = "No video found for this selection.";
    return;
  }

  const block = document.createElement("div");
  block.className = "video-block";

  const desc = document.createElement("p");
  desc.className = "description";
  desc.innerHTML = '&nbsp;Task: "' + item.description + '"';

  const video = document.createElement("video");
  video.setAttribute("controls", "");
  video.setAttribute("controlslist", "");
  video.disablePictureInPicture = true;

  const source = document.createElement("source");
  source.src = "videos/" + item.file;
  source.type = "video/mp4";

  video.appendChild(source);

  video.addEventListener("loadedmetadata", () => {
    applyPlaybackSpeed(video);
  });
  block.appendChild(desc);
  block.appendChild(video);
  container.appendChild(block);
}

dropdown.addEventListener("change", function () {
  renderVideos(this.value);
});

speedDropdown.addEventListener("change", () => {
  localStorage.setItem("globalPlaybackSpeed", speedDropdown.value);

  document.querySelectorAll("video").forEach(video => {
    const hadStarted = video.currentTime > 0 || !video.paused;
    const shouldResume = !video.paused && !video.ended;

    applyPlaybackSpeed(video);

    if (hadStarted) {
      video.pause();
      video.currentTime = 0;
      video.load();

      video.addEventListener(
        "loadedmetadata",
        () => {
          applyPlaybackSpeed(video);

          if (shouldResume) {
            video.play().catch(error => {
              console.warn("Video playback could not be restarted:", error);
            });
          }
        },
        { once: true }
      );
    }
  });
});

renderVideos();
</script>

</body>
</html>
